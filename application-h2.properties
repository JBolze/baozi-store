# =====================================================================
# Perfil "h2" - banco em memoria, para rodar o projeto sem instalar
# MySQL. Uso:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
#   java -jar target/baozi-store-1.0.0.jar --spring.profiles.active=h2
# =====================================================================
spring.datasource.url=jdbc:h2:mem:baozi_store;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
