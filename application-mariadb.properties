# =====================================================================
# Perfil "mariadb" — utiliza o driver oficial do MariaDB (MariaDB
# Connector/J). Uso:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mariadb
#   java -jar target/baozi-store-1.0.0.jar --spring.profiles.active=mariadb
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/baozi_store}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
