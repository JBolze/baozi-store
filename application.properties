spring.application.name=baozi-store
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# Banco de dados principal: MySQL / MariaDB
#
# Antes de subir a aplicacao, crie o banco:
#   CREATE DATABASE baozi_store CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#
# As tabelas sao criadas automaticamente pelo Hibernate (ddl-auto=update).
# Para usar outro usuario/senha, ajuste DB_USERNAME / DB_PASSWORD (ou
# edite os valores padrao abaixo).
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/baozi_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# JSON
# ---------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
